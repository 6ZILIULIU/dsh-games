<script>/* 灵刃战棋 — 单文件回合制战棋（Game Studio / collector 模板重写）
 * 45 度等距网格；Canvas 2D；全部名称与美术原创。
 * 对外契约：window.__gameState / window.__autoplay / window.__renderSlots
 */
(function () {
  'use strict';

  var GAME = (typeof window !== 'undefined' && window.GAME) || {};
  var RAW = GAME.rules || {};
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
  var R = {
    boardW: num(RAW.boardW, 8), boardH: num(RAW.boardH, 8),
    tileW: num(RAW.tileW, 76), tileH: num(RAW.tileH, 38),
    heightStep: num(RAW.heightStep, 15),
    apPerTurn: num(RAW.apPerTurn, 2), energyMax: num(RAW.energyMax, 100),
    startLevel: num(RAW.startLevel, 1), enemyHp: num(RAW.enemyHp, 1),
    guardMs: num(RAW.guardMs, 4000),
    disclaimer: RAW.disclaimer || '本作为个人学习、非商业、原创致敬作品。'
  };

  var canvas = document.getElementById('game');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'game';
    canvas.tabIndex = 0;
    (document.body || document.documentElement).appendChild(canvas);
  }
  var ctx = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  canvas.style.touchAction = 'none';
  canvas.style.outline = 'none';
  canvas.style.webkitTapHighlightColor = 'transparent';

  var W = 390, H = 844, dpr = 1;
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ========== 1. DATA ========== */
  var SIDE_A = '#4fd1e0', SIDE_A_D = '#16324f', SIDE_A_L = '#c9f6ff';
  var SIDE_B = '#ff7a59', SIDE_B_D = '#5d2030', SIDE_B_L = '#ffd6c2';
  var GOLD = '#ffcc66', GREEN = '#7ee08a', RED = '#ff6b6b', PURPLE = '#c08cff';
  var INK = '#0b1020', PANEL = '#141d34', LINE = '#2c3d63';

  // 三系循环：灵 -> 术 -> 体 -> 灵
  var ELEM = { ling: { name: '灵', c: '#6fe3ff' }, shu: { name: '术', c: '#ffb36b' }, ti: { name: '体', c: '#9be36b' }, none: { name: '无', c: '#c7d2e8' } };
  function elemMul(a, b) {
    if (a === 'none' || b === 'none') return 1;
    if (a === b) return 1;
    if ((a === 'ling' && b === 'shu') || (a === 'shu' && b === 'ti') || (a === 'ti' && b === 'ling')) return 1.3;
    return 0.75;
  }

  // 六名可操作角色（原创名）。side 决定配色。
  var HEROES = {
    xuanye: { name: '玄夜', side: 'A', role: '输出', elem: 'ling', hp: 32, atk: 9, def: 3, mov: 3, rng: 1, basic: '黑刃斩', small: '裂魂·一阶', ult: '断界·二阶', passive: '灵刃本能', desc: '高机动近战，高处作战更强。' },
    yanliu: { name: '岩鎏', side: 'A', role: '守护', elem: 'ling', hp: 44, atk: 6, def: 7, mov: 2, rng: 1, basic: '镇守击', small: '岩壁·一阶', ult: '不破城·二阶', passive: '厚重', desc: '高防高血，适合堵路。' },
    feiying: { name: '绯樱', side: 'A', role: '支援', elem: 'ling', hp: 27, atk: 5, def: 3, mov: 3, rng: 2, basic: '花讯', small: '回生·一阶', ult: '双穹回生阵·二阶', passive: '治愈光环', desc: '远程治疗，周围友军每回合回复。' },
    chiyan: { name: '赤焰', side: 'B', role: '输出', elem: 'shu', hp: 30, atk: 9, def: 3, mov: 3, rng: 1, basic: '焰拳', small: '焰旋·一阶', ult: '贯天焰·二阶', passive: '烈焰本能', desc: '爆发型近战，克制体术。' },
    shayu: { name: '砂狱', side: 'B', role: '守护', elem: 'shu', hp: 42, atk: 6, def: 6, mov: 2, rng: 1, basic: '砂击', small: '砂牢·一阶', ult: '砂界囚笼·二阶', passive: '砂之壁', desc: '控制型坦克，擅长守点。' },
    yinglan: { name: '樱岚', side: 'B', role: '支援', elem: 'ti', hp: 29, atk: 6, def: 3, mov: 3, rng: 2, basic: '樱击', small: '碎岳·一阶', ult: '樱力碎岳阵·二阶', passive: '怪力', desc: '近战支援，攻守兼备。' }
  };
  var HERO_KEYS = ['xuanye', 'yanliu', 'feiying', 'chiyan', 'shayu', 'yinglan'];

  // 技能定义：每角色 4 个（普攻 / 小招 / 大招 / 被动）
  function makeSkills(def) {
    return [
      { id: 'basic', name: def.basic, kind: 'damage', range: def.rng, area: 0, power: 1.0, ap: 1, energy: 0, gain: 20, cd: 0, desc: '基础攻击，命中后回复灵能。' },
      { id: 'small', name: def.small, kind: 'damage', range: def.rng + 1, area: 0, power: 1.35, ap: 1, energy: 30, gain: 0, cd: 2, desc: '消耗 30 灵能，威力更高。' },
      { id: 'ult', name: def.ult, kind: 'aoe', range: def.rng + 1, area: 1, power: 1.8, ap: 2, energy: 100, gain: 0, cd: 0, perBattle: 1, desc: '每战一次的强力范围招式。' },
      { id: 'passive', name: def.passive, kind: 'passive', range: 0, area: 0, power: 0, ap: 0, energy: 0, cd: 0, desc: def.desc }
    ];
  }
  var SKILLS = {};
  HERO_KEYS.forEach(function (k) { SKILLS[k] = makeSkills(HEROES[k]); });

  // 敌方单位（杂兵 3 种 + 首领 3 个）
  var FOES = {
    shadow: { name: '影兵', side: 'B', elem: 'shu', hp: 18, atk: 6, def: 2, mov: 3, rng: 1, cls: 'chiyan' },
    stalker: { name: '斥候', side: 'B', elem: 'ti', hp: 16, atk: 7, def: 1, mov: 4, rng: 1, cls: 'yinglan' },
    warden: { name: '卫卒', side: 'B', elem: 'ling', hp: 22, atk: 5, def: 4, mov: 2, rng: 1, cls: 'shayu' },
    boss1: { name: '塔影', side: 'B', elem: 'shu', hp: 40, atk: 8, def: 4, mov: 2, rng: 1, cls: 'chiyan', boss: true },
    boss2: { name: '冰魄', side: 'B', elem: 'ling', hp: 44, atk: 8, def: 5, mov: 2, rng: 2, cls: 'feiying', boss: true, ranged: true },
    boss3: { name: '无相主', side: 'B', elem: 'none', hp: 58, atk: 10, def: 6, mov: 2, rng: 2, cls: 'shayu', boss: true, ranged: true }
  };

  // 地形模板：. 平地 / ^ 高地1 / H 高地2 / # 障碍 / f 林地(半掩体)
  var MAPS = {
    m1: ['........', '..^..^..', '........', '..#..#..', '..#..#..', '........', '..^..^..', '........'],
    m2: ['..H..H..', '...ff...', '.^....^.', '..#..#..', '..#..#..', '.^....^.', '...ff...', '..H..H..'],
    m3: ['..###...', '.^...^..', '....f...', 'H..##..H', 'H..##..H', '....f...', '.^...^..', '..###...'],
    m4: ['........', '.H.^^.H.', '..f..f..', '.^.#^.^.', '.^.#^.^.', '..f..f..', '.H.^^.H.', '........']
  };

  // 12 关配置：章节 / 地图 / 敌方构成 / 胜负 / 奖励
  var LEVELS = [
    { ch: 1, name: '楔子·初阵', map: 'm1', foes: ['shadow', 'shadow'], turns: 12, reward: 40 },
    { ch: 1, name: '雨岸', map: 'm1', foes: ['shadow', 'stalker', 'shadow'], turns: 12, reward: 45 },
    { ch: 1, name: '渡口', map: 'm2', foes: ['shadow', 'warden', 'stalker'], turns: 14, reward: 50 },
    { ch: 1, name: '桥头·守', map: 'm2', foes: ['shadow', 'shadow', 'warden', 'boss1'], turns: 16, reward: 70, star: '全员存活' },
    { ch: 2, name: '猎影', map: 'm2', foes: ['stalker', 'stalker', 'shadow', 'warden'], turns: 14, reward: 55 },
    { ch: 2, name: '林隙', map: 'm3', foes: ['shadow', 'shadow', 'stalker', 'warden'], turns: 15, reward: 60 },
    { ch: 2, name: '裂谷', map: 'm3', foes: ['stalker', 'warden', 'shadow', 'stalker', 'warden'], turns: 16, reward: 65 },
    { ch: 2, name: '寒渊·破', map: 'm4', foes: ['shadow', 'warden', 'shadow', 'boss2'], turns: 18, reward: 90, star: '全员存活' },
    { ch: 3, name: '归墟', map: 'm4', foes: ['stalker', 'shadow', 'warden', 'stalker', 'shadow'], turns: 16, reward: 70 },
    { ch: 3, name: '残响', map: 'm3', foes: ['warden', 'warden', 'stalker', 'shadow', 'stalker'], turns: 17, reward: 75 },
    { ch: 3, name: '断界', map: 'm2', foes: ['shadow', 'stalker', 'warden', 'boss1', 'boss2'], turns: 18, reward: 95 },
    { ch: 3, name: '终局·无相', map: 'm4', foes: ['warden', 'stalker', 'shadow', 'boss3'], turns: 20, reward: 150, star: '全员存活' }
  ];

  /* ========== 2. STATE ========== */
  var screen = 'title'; // title | base | battle | won | lost | about
  var prevScreen = 'title';
  var save = null;
  var battle = null;
  var selected = null;
  var mode = 'move'; // move | basic | small | ult
  var reachable = {};
  var fx = [];
  var pointers = {};
  var keys = {};
  var lastTime = 0, fps = 60, fpsAcc = 0, fpsCnt = 0;
  var actionStamp = 0, lastActionAt = 0;
  var aiTimer = 0;
  var toast = '', toastT = 0;

  var SAVE_KEY = 'lingren_tactics_save_v3';

  function defaultSave() {
    return {
      version: 3,
      levelIndex: 0,
      unlocked: 1,
      cleared: [],
      stars: {},
      gold: 0,
      squad: ['xuanye', 'yanliu', 'feiying'],
      unlockedHeroes: ['xuanye', 'yanliu', 'feiying'],
      roster: {},
      savedAt: 0
    };
  }
  HERO_KEYS.forEach(function (k) { /* roster 在 load 时补齐 */ });

  function rosterEntry(cls) {
    if (!save.roster[cls]) save.roster[cls] = { level: 1, exp: 0, breakthrough: 0, relic: 0 };
    return save.roster[cls];
  }
  function loadSave() {
    try {
      var raw = window.localStorage && localStorage.getItem(SAVE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.version === 3) { save = s; }
      }
    } catch (e) { /* ignore */ }
    if (!save) save = defaultSave();
    HERO_KEYS.forEach(rosterEntry);
    if (!save.squad || !save.squad.length) save.squad = save.unlockedHeroes.slice(0, 3);
  }
  function persist() {
    save.savedAt = Date.now();
    try { if (window.localStorage) localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
  }

  // 角色成长后的实际属性
  function statsFor(cls) {
    var d = HEROES[cls], r = rosterEntry(cls);
    var lv = r.level - 1, bt = r.breakthrough, rel = r.relic;
    return {
      hp: Math.round(d.hp + lv * 3 + bt * 3 + rel * 1),
      atk: Math.round(d.atk + lv * 1.5 + bt * 1.5 + rel * 2),
      def: Math.round(d.def + lv * 0.6 + bt * 0.8 + rel * 1),
      mov: d.mov, rng: d.rng, elem: d.elem, side: d.side
    };
  }

  /* ========== 3. ISO 坐标 ========== */
  var view = { ox: 0, oy: 0, scale: 1, maxH: 2, tw: 76, th: 38, hz: 15 };
  function computeView() {
    var m = MAPS[LEVELS[battle ? battle.levelIndex : save.levelIndex].map];
    var gw = m[0].length, gh = m.length;
    var maxH = 0;
    for (var y = 0; y < gh; y++) for (var x = 0; x < gw; x++) {
      var c = m[y][x]; if (c === 'H') maxH = Math.max(maxH, 2); else if (c === '^') maxH = Math.max(maxH, 1);
    }
    var tw = R.tileW, th = R.tileH, hz = R.heightStep;
    var boardPixelW = (gw + gh) * tw / 2;
    var boardPixelH = (gw + gh) * th / 2 + maxH * hz;
    var top = 108, bottom = H - PANEL_TOP - 10;
    var availW = W - 18, availH = bottom - top;
    var scale = Math.min(availW / boardPixelW, availH / boardPixelH);
    view.scale = scale; view.tw = tw; view.th = th; view.hz = hz; view.maxH = maxH;
    view.ox = W / 2;
    view.oy = top + (availH - boardPixelH * scale) / 2 + maxH * hz * scale;
  }
  function gridToScreen(gx, gy, h) {
    var s = view.scale;
    return {
      x: view.ox + (gx - gy) * (view.tw / 2) * s,
      y: view.oy + (gx + gy) * (view.th / 2) * s - (h || 0) * view.hz * s
    };
  }
  function screenToGrid(px, py) {
    var s = view.scale;
    var dx = (px - view.ox) / ((view.tw / 2) * s);
    var dy = (py - view.oy) / ((view.th / 2) * s);
    return { gx: Math.round((dx + dy) / 2), gy: Math.round((dy - dx) / 2) };
  }
  function unitScreen(u) {
    var p = gridToScreen(u.gx, u.gy, u.height || 0);
    if (u.anim) {
      var t = clamp(u.anim.t, 0, 1);
      p = {
        x: lerp(gridToScreen(u.anim.fx, u.anim.fy, u.anim.fh).x, p.x, t),
        y: lerp(gridToScreen(u.anim.fx, u.anim.fy, u.anim.fh).y, p.y, t)
      };
    }
    return p;
  }

  /* ========== 4. BATTLE SETUP ========== */
  function makeTileMap(key) {
    var m = MAPS[key], tiles = [];
    for (var gy = 0; gy < m.length; gy++) {
      var row = [];
      for (var gx = 0; gx < m[gy].length; gx++) {
        var c = m[gy][gx], h = 0, cover = 0, walkable = true;
        if (c === '^') h = 1; else if (c === 'H') h = 2;
        else if (c === '#') { walkable = false; }
        else if (c === 'f') cover = 1;
        row.push({ gx: gx, gy: gy, terrain: c, height: h, cover: cover, walkable: walkable });
      }
      tiles.push(row);
    }
    return tiles;
  }
  function spawnUnit(cls, side, gx, gy, isHero) {
    var def = isHero ? HEROES[cls] : FOES[cls];
    var st = isHero ? statsFor(cls) : { hp: Math.round(def.hp * R.enemyHp), atk: def.atk, def: def.def, mov: def.mov, rng: def.rng, elem: def.elem, side: side };
    var u = {
      id: 'u' + (battle.uid++), cls: cls, name: def.name, side: side,
      gx: gx, gy: gy, height: tileAt(gx, gy) ? tileAt(gx, gy).height : 0,
      hp: st.hp, maxHp: st.hp, atk: st.atk, def: st.def, mov: st.mov, rng: st.rng,
      elem: st.elem, ap: R.apPerTurn, energy: 0,
      skills: isHero ? SKILLS[cls] : foeSkills(def),
      cd: {}, usedUlt: false, movedFlag: false, dead: false,
      boss: !!def.boss, ranged: !!def.ranged, phase2: false,
      anim: null, flash: 0, isHero: !!isHero
    };
    if (isHero) u.skills.forEach(function (sk) { u.cd[sk.id] = 0; });
    return u;
  }
  function foeSkills(def) {
    return [
      { id: 'basic', name: '突袭', kind: 'damage', range: def.rng, area: 0, power: 1.0, ap: 1, energy: 0, cd: 0 },
      { id: 'small', name: def.boss ? '凶击' : '猛击', kind: 'damage', range: def.rng, area: 0, power: def.boss ? 1.5 : 1.2, ap: 1, energy: 0, cd: 2 }
    ];
  }
  function tileAt(gx, gy) {
    if (!battle || !battle.tiles[gy]) return null;
    return battle.tiles[gy][gx] || null;
  }
  function startLevel(index) {
    index = clamp(index, 0, LEVELS.length - 1);
    var lv = LEVELS[index];
    battle = {
      levelIndex: index, tiles: makeTileMap(lv.map), foes: lv.foes.slice(),
      units: [], turn: 1, side: 'A', uid: 1, aiIndex: 0, busy: false,
      result: null, maxTurns: lv.turns, lv: lv
    };
    // 玩家部署：前排到底部
    var spots = [[1, 6], [3, 7], [5, 6], [2, 7], [4, 7], [6, 6]];
    save.squad.forEach(function (cls, i) {
      var sp = spots[i % spots.length];
      battle.units.push(spawnUnit(cls, 'A', sp[0], sp[1], true));
    });
    // 敌方部署：顶部
    var espots = [[6, 1], [3, 0], [1, 1], [4, 1], [2, 0], [5, 0]];
    lv.foes.forEach(function (f, i) {
      var sp = espots[i % espots.length];
      battle.units.push(spawnUnit(f, 'B', sp[0], sp[1], false));
    });
    selected = null; mode = 'move'; reachable = {}; fx = [];
    screen = 'battle'; actionStamp++; lastActionAt = now();
    computeView(); persist();
  }
  function alive(side) { return battle.units.filter(function (u) { return !u.dead && u.side === side; }); }
  function unitAt(gx, gy) {
    for (var i = 0; i < battle.units.length; i++) {
      var u = battle.units[i];
      if (!u.dead && u.gx === gx && u.gy === gy) return u;
    }
    return null;
  }

  /* ========== 5. MOVEMENT / COMBAT ========== */
  function bfsReach(u) {
    var out = {}, cost = {};
    var start = u.gx + ',' + u.gy;
    cost[start] = 0; out[start] = true;
    var q = [{ gx: u.gx, gy: u.gy, c: 0 }];
    while (q.length) {
      var cur = q.shift();
      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var i = 0; i < dirs.length; i++) {
        var nx = cur.gx + dirs[i][0], ny = cur.gy + dirs[i][1];
        var t = tileAt(nx, ny);
        if (!t || !t.walkable || unitAt(nx, ny)) continue;
        var hdiff = t.height - (tileAt(cur.gx, cur.gy) ? tileAt(cur.gx, cur.gy).height : 0);
        var step = 1 + (hdiff > 0 ? hdiff : 0);
        var nc = cur.c + step;
        if (nc > u.mov) continue;
        var k = nx + ',' + ny;
        if (cost[k] === undefined || nc < cost[k]) {
          cost[k] = nc; out[k] = true;
          q.push({ gx: nx, gy: ny, c: nc });
        }
      }
    }
    delete out[start];
    return out;
  }
  function dist(a, b) { return Math.abs(a.gx - b.gx) + Math.abs(a.gy - b.gy); }
  function inRange(u, target, skill) {
    var d = Math.max(Math.abs(u.gx - target.gx), Math.abs(u.gy - target.gy));
    return d <= (skill ? skill.range : u.rng);
  }
  function hasLineOfSight(a, b) {

    }
    var u = selected;
    if (!u.movedFlag) {
      var reach = bfsReach(u), best = null, bestD = 1e9;
      var foes = alive('B');

    else if (screen !== 'title' && screen !== 'about') p = 'playing';
    var hero = null;
    if (battle) hero = selected && !selected.dead ? selected : alive('A')[0];
    return {
      phase: p,
      screen: screen,
      score: battle ? (battle.units.filter(function (u) { return u.dead && u.side === 'B'; }).length * 100 + battle.turn * 10 + battle.levelIndex * 1000) : 0,
      hearts: battle ? alive('A').length : 3,
      hero: hero ? { x: r(hero.gx), y: r(hero.gy) } : { x: 0, y: 0 },
      enemies: battle ? alive('B').map(function (u) { return { x: r(u.gx), y: r(u.gy) }; }) : [],
      pickups: [],
      world: { w: battle ? battle.tiles[0].length : R.boardW, h: battle ? battle.tiles.length : R.boardH },
      fps: r(fps),
      turn: battle ? battle.turn : 0,
      side: battle ? battle.side : 'A',
      busy: battle ? battle.busy : false,
      level: battle ? battle.levelIndex + 1 : save.levelIndex + 1,
      gold: save.gold,
      actionStamp: actionStamp,
      heroOnScreen: true
    };
  };

  /* ========== 11. CHARACTER CLOSE-UPS ========== */
  function drawCharacter(g, key, size, sideOverride) {
    var def = HEROES[key] || FOES[key] || HEROES.xuanye;
    var side = sideOverride || def.side || 'A';
    var c1 = side === 'A' ? SIDE_A : SIDE_B;
    var c2 = side === 'A' ? SIDE_A_D : SIDE_B_D;
    var c3 = side === 'A' ? SIDE_A_L : SIDE_B_L;
    var s = size;
    g.save();
    // 影子
    g.fillStyle = 'rgba(0,0,0,0.28)';
    g.beginPath(); g.ellipse(0, -s * 0.02, s * 0.28, s * 0.08, 0, 0, TAU); g.fill();
    // 腿
    g.fillStyle = c2;
    g.fillRect(-s * 0.16, -s * 0.38, s * 0.13, s * 0.36);
    g.fillRect(s * 0.03, -s * 0.38, s * 0.13, s * 0.36);
    // 躯干
    g.fillStyle = c1;
    g.beginPath();
    g.moveTo(-s * 0.22, -s * 0.36);
    g.lineTo(-s * 0.18, -s * 0.72);
    g.lineTo(s * 0.18, -s * 0.72);
    g.lineTo(s * 0.22, -s * 0.36);
    g.closePath(); g.fill();
    // 披风/护肩
    g.fillStyle = c2;
    g.beginPath();
    g.moveTo(-s * 0.22, -s * 0.7);
    g.lineTo(-s * 0.34, -s * 0.3);
    g.lineTo(-s * 0.1, -s * 0.38);
    g.closePath(); g.fill();
    // 头
    g.fillStyle = c3;
    g.beginPath(); g.arc(0, -s * 0.82, s * 0.13, 0, TAU); g.fill();
    // 头部装饰（发/盔）
    g.fillStyle = c2;
    g.beginPath(); g.arc(0, -s * 0.86, s * 0.135, Math.PI, TAU); g.fill();
    // 职业标识
    if (key === 'yanliu' || key === 'shayu' || key === 'warden' || key === 'boss3') {
      g.fillStyle = c2; g.fillRect(s * 0.16, -s * 0.62, s * 0.16, s * 0.34);
      g.strokeStyle = GOLD; g.lineWidth = Math.max(1, s * 0.02); g.strokeRect(s * 0.16, -s * 0.62, s * 0.16, s * 0.34);
    } else if (key === 'feiying' || key === 'yinglan' || key === 'boss2' || key === 'feiying') {
      g.strokeStyle = GOLD; g.lineWidth = Math.max(1, s * 0.025);
      g.beginPath(); g.moveTo(s * 0.24, -s * 0.08); g.lineTo(s * 0.26, -s * 0.78); g.stroke();
      g.fillStyle = c3; g.beginPath(); g.arc(s * 0.26, -s * 0.82, s * 0.07, 0, TAU); g.fill();
    } else {
      g.strokeStyle = c3; g.lineWidth = Math.max(1, s * 0.03);
      g.beginPath(); g.moveTo(s * 0.2, -s * 0.1); g.lineTo(s * 0.3, -s * 0.86); g.stroke();
    }
    g.restore();
  }
  window.__renderSlots = function (size) {
    size = size || 256;
    var out = {};
    HERO_KEYS.forEach(function (key) {
      var c = document.createElement('canvas');
      c.width = size; c.height = size;
      var g = c.getContext('2d');
      g.clearRect(0, 0, size, size);
      g.translate(size / 2, size * 0.88);
      drawCharacter(g, key, size * 0.86);
      out[key] = c.toDataURL('image/png');
    });
    return out;
  };
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ source: 'dsh-game-studio', type: 'renders', renders: window.__renderSlots(256) }, '*');
    }
  } catch (e) { /* ignore */ }

  /* ========== 12. RENDER ========== */
  function rr(x, y, w, h, r) {
    var rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
  }
  function bg() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a1024'); g.addColorStop(0.55, '#101a33'); g.addColorStop(1, '#070c18');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 星点
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (var i = 0; i < 30; i++) {
      var x = (i * 137) % W, y = (i * 83) % (H * 0.4);
      ctx.fillRect(x, y, 1.5, 1.5);
    }
  }
  function text(str, x, y, size, color, align, bold) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function button(b, active) {
    ctx.save();
    ctx.fillStyle = active ? '#21345c' : PANEL;
    rr(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = active ? GOLD : LINE; ctx.lineWidth = 1.5; ctx.stroke();
    text(b.label, b.x + b.w / 2, b.y + (b.sub ? b.h / 2 - 8 : b.h / 2), b.sub ? 17 : 18, active ? GOLD : '#e6edff', 'center', true);
    if (b.sub) text(b.sub, b.x + b.w / 2, b.y + b.h / 2 + 12, 10, '#8fa2c8', 'center');
    ctx.restore();
  }

  function renderTitle() {
    bg();
    text('灵 刃 战 棋', W / 2, H * 0.24, 42, GOLD, 'center', true);
    text('—— 原创回合制战棋 ——', W / 2, H * 0.24 + 40, 16, '#9fb4dd', 'center');
    // 两个剪影（下移，避免遮挡副标题）
    ctx.save(); ctx.translate(W / 2 - 78, H * 0.62); drawCharacter(ctx, 'xuanye', 138); ctx.restore();
    ctx.save(); ctx.translate(W / 2 + 78, H * 0.62); drawCharacter(ctx, 'chiyan', 138); ctx.restore();
    var b = { x: W / 2 - 100, y: H - 190, w: 200, h: 58, label: '开始战役' };
    button(b, now() % 1000 < 500);
    text('点击屏幕 / 回车 开始', W / 2, H - 108, 13, '#7d90b8', 'center');
  }
  function renderAbout() {
    bg();
    text('关于 / 版权声明', W / 2, 90, 24, GOLD, 'center', true);
    var words = R.disclaimer;
    ctx.font = '14px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#c4d2ef'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    var lines = wrapText(words, W - 48, 14);
    lines.forEach(function (l, i) { ctx.fillText(l, 24, 140 + i * 24); });
    text('点击返回', W / 2, H - 80, 14, '#7d90b8', 'center');
  }
  function wrapText(str, maxW, fs) {
    ctx.font = fs + 'px system-ui, "Microsoft YaHei", sans-serif';
    var chars = str.split(''), lines = [], cur = '';
    chars.forEach(function (c) {
      if (ctx.measureText(cur + c).width > maxW) { lines.push(cur); cur = c; }
      else cur += c;
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function renderBase() {
    bg();
    text('灵刃战棋', 20, 44, 26, GOLD, 'left', true);
    text('金币 ' + save.gold, W - 20, 44, 16, GOLD, 'right', true);
    var lv = Math.min(save.levelIndex, LEVELS.length - 1);
    text('战役进度：第 ' + (save.levelIndex + 1) + ' 关 / ' + LEVELS.length, 20, 78, 14, '#9fb4dd');
    text('选择出战角色（最多 3 名，点击切换）', 20, 276, 13, '#8fa2c8');
    var bs = baseButtons();
    HERO_KEYS.forEach(function (k) {
      var b = bs.filter(function (x) { return x.id === 'hero_' + k; })[0];
      var locked = save.unlockedHeroes.indexOf(k) < 0;
      var inSquad = save.squad.indexOf(k) >= 0;
      ctx.save();
      ctx.fillStyle = locked ? '#1a2236' : (inSquad ? '#23406a' : PANEL);
      rr(b.x, b.y, b.w, b.h, 10); ctx.fill();
      ctx.strokeStyle = baseFocus === k ? GOLD : (inSquad ? SIDE_A : LINE); ctx.lineWidth = 2; ctx.stroke();
      ctx.translate(b.x + b.w / 2, b.y + b.h * 0.72);
      drawCharacter(ctx, k, b.h * 0.62);
      ctx.restore();
      text(locked ? '未解锁' : HEROES[k].name, b.x + b.w / 2, b.y + 16, 13, locked ? '#5d6b8a' : '#e6edff', 'center', true);
      if (!locked) {
        var r = rosterEntry(k);
        text('Lv' + r.level + ' ' + '★'.repeat(r.breakthrough), b.x + b.w / 2, b.y + b.h - 10, 10, GOLD, 'center');
      }
    });
    bs.filter(function (b) { return ['deploy', 'upgrade', 'break', 'relic', 'about'].indexOf(b.id) >= 0; })
      .forEach(function (b) { button(b, false); });
    if (toastT > 0) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; rr(W / 2 - 90, H - 326, 180, 30, 8); ctx.fill(); text(toast, W / 2, H - 311, 13, GOLD, 'center'); }
  }

  function renderBoard() {
    var t = battle.tiles, gw = t[0].length, gh = t.length;
    // 地形（按深度排序）
    var order = [];
    for (var gy = 0; gy < gh; gy++) for (var gx = 0; gx < gw; gx++) order.push({ gx: gx, gy: gy, tile: t[gy][gx] });
    order.sort(function (a, b) { return (a.gx + a.gy) - (b.gx + b.gy); });
    var colors = { '.': '#1e2c46', '^': '#2b3f60', 'H': '#37527a', '#': '#0d1526', 'f': '#234233' };
    order.forEach(function (o) {
      var tile = o.tile, p = gridToScreen(o.gx, o.gy, 0);
      var hw = view.tw / 2 * view.scale, hh = view.th / 2 * view.scale;
      // 侧面（高度）
      if (tile.height > 0) {
        var sideH = tile.height * view.hz * view.scale;
        ctx.fillStyle = '#101a2e';
        ctx.beginPath();
        ctx.moveTo(p.x - hw, p.y); ctx.lineTo(p.x, p.y + hh); ctx.lineTo(p.x, p.y + hh + sideH); ctx.lineTo(p.x - hw, p.y + sideH);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#0a1222';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y + hh); ctx.lineTo(p.x + hw, p.y); ctx.lineTo(p.x + hw, p.y + sideH); ctx.lineTo(p.x, p.y + hh + sideH);
        ctx.closePath(); ctx.fill();
      }
      // 顶面
      var top = gridToScreen(o.gx, o.gy, tile.height);
      ctx.fillStyle = colors[tile.terrain] || '#1e2c46';
      ctx.beginPath();
      ctx.moveTo(top.x, top.y - hh); ctx.lineTo(top.x + hw, top.y);
      ctx.lineTo(top.x, top.y + hh); ctx.lineTo(top.x - hw, top.y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120,160,220,0.18)'; ctx.lineWidth = 1; ctx.stroke();
      if (tile.terrain === 'f') {
        ctx.fillStyle = '#3f7a54';
        ctx.beginPath(); ctx.arc(top.x - 6, top.y - 2, 5, 0, TAU); ctx.arc(top.x + 6, top.y + 2, 5, 0, TAU); ctx.fill();
      }
    });
    // 可达高亮
    if (selected && mode === 'move') {
      for (var k in reachable) {
        var pp = k.split(','), gx2 = +pp[0], gy2 = +pp[1];
        var tp = tileAt(gx2, gy2); if (!tp) continue;
        var q = gridToScreen(gx2, gy2, tp.height);
        var hw2 = view.tw / 2 * view.scale, hh2 = view.th / 2 * view.scale;
        ctx.fillStyle = 'rgba(79,209,224,0.28)';
        ctx.beginPath(); ctx.moveTo(q.x, q.y - hh2); ctx.lineTo(q.x + hw2, q.y); ctx.lineTo(q.x, q.y + hh2); ctx.lineTo(q.x - hw2, q.y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = SIDE_A; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    // 单位（画家算法）
    var us = battle.units.filter(function (u) { return !u.dead; });
    us.sort(function (a, b) { return (a.gx + a.gy) * 10 + (a.height || 0) - ((b.gx + b.gy) * 10 + (b.height || 0)); });
    us.forEach(function (u) {
      var p = unitScreen(u);
      var sz = view.tw * view.scale * 1.32;
      ctx.save(); ctx.translate(p.x, p.y);
      if (u === selected) {
        ctx.strokeStyle = GOLD; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, sz * 0.34, sz * 0.14, 0, 0, TAU); ctx.stroke();
      }
      ctx.save();
      if (u.flash > 0) { ctx.globalAlpha = 1; }
      drawCharacter(ctx, u.cls, sz, u.side);
      ctx.restore();
      // 血条
      var bw = sz * 0.6, bh = 4;
      ctx.fillStyle = '#0a0f1c'; ctx.fillRect(-bw / 2, -sz * 1.18, bw, bh);
      ctx.fillStyle = u.side === 'A' ? GREEN : RED;
      ctx.fillRect(-bw / 2, -sz * 1.18, bw * (u.hp / u.maxHp), bh);
      if (u.boss) text('◆', 0, -sz * 1.32, 11, GOLD, 'center');
      // 元素标记
      text(ELEM[u.elem].name, -sz * 0.36, -sz * 1.1, 9, ELEM[u.elem].c, 'center', true);
      ctx.restore();
    });
    // 特效
    fx.forEach(function (f) {
      var a = 1 - f.t / f.life;
      ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
      if (f.type === 'txt') {
        text(f.text, f.x, f.y - (f.t / f.life) * 24, 15, f.color, 'center', true);
      } else if (f.type === 'slash') {
        text(f.text, f.x, f.y - 8, 12, f.color, 'center', true);
      }
      ctx.restore();
    });
  }
  function renderBattle() {
    bg();
    // 顶栏
    ctx.fillStyle = 'rgba(8,13,26,0.9)'; ctx.fillRect(0, 0, W, 92);
    var lv = LEVELS[battle.levelIndex];
    text('第 ' + (battle.levelIndex + 1) + ' 关 · ' + lv.name, 14, 26, 16, GOLD, 'left', true);
    text('回合 ' + battle.turn + '/' + battle.maxTurns, W - 14, 26, 14, battle.side === 'A' ? SIDE_A : SIDE_B, 'right', true);
    text('我方 ' + alive('A').length + ' · 敌方 ' + alive('B').length, 14, 54, 13, '#aebfe0');
    text(battle.side === 'A' ? '我方回合' : '敌方回合', W - 14, 54, 13, battle.side === 'A' ? SIDE_A : SIDE_B, 'right');
    renderBoard();
    // 底部面板（信息区 H-190..H-128，按钮区 H-122..）
    ctx.fillStyle = 'rgba(8,13,26,0.96)'; ctx.fillRect(0, H - PANEL_TOP, W, PANEL_TOP);
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H - PANEL_TOP); ctx.lineTo(W, H - PANEL_TOP); ctx.stroke();
    if (selected) {
      text(selected.name + ' · ' + HEROES[selected.cls].role, 14, H - 178, 15, GOLD, 'left', true);
      text('HP ' + selected.hp + '/' + selected.maxHp + '  攻 ' + selected.atk + '  防 ' + selected.def + '  灵能 ' + selected.energy, 14, H - 156, 12, '#c4d2ef');
      var sk = selected.skills.filter(function (s) { return s.id === mode; })[0];
      if (sk && mode !== 'move') text(sk.name + '：' + sk.desc, 14, H - 136, 11, '#9fb4dd');
      else text('AP ' + selected.ap + '/' + R.apPerTurn + ' · 移动力 ' + selected.mov, 14, H - 136, 11, '#9fb4dd');
    } else {
      text('点击我方角色开始行动', 14, H - 170, 14, '#9fb4dd');
      text('选中后点蓝色格移动，再选普攻/技能点敌人', 14, H - 146, 11, '#7d90b8');
    }
    battleButtons().forEach(function (b) { button(b, false); });
    if (toastT > 0) { ctx.fillStyle = 'rgba(0,0,0,0.65)'; rr(W / 2 - 100, 104, 200, 30, 8); ctx.fill(); text(toast, W / 2, 119, 13, GOLD, 'center'); }
  }
  function renderResult(win) {
    bg();
    text(win ? '战 胜' : '战 败', W / 2, H * 0.34, 46, win ? GOLD : RED, 'center', true);
    if (win) {
      var lv = LEVELS[battle.levelIndex];
      text('第 ' + (battle.levelIndex + 1) + ' 关 · ' + lv.name + ' 完成', W / 2, H * 0.34 + 48, 16, '#c4d2ef', 'center');
      text('获得 ' + lv.reward + ' 金币 · 星级 ' + (save.stars[battle.levelIndex] || 1), W / 2, H * 0.34 + 78, 14, GOLD, 'center');
    } else {
      text('调整战术，再试一次', W / 2, H * 0.34 + 50, 16, '#c4d2ef', 'center');
    }
    button({ x: W / 2 - 110, y: H - 180, w: 220, h: 62, label: win ? (battle.levelIndex + 1 < LEVELS.length ? '下一关' : '通关') : '重 试' }, true);
    button({ x: W / 2 - 110, y: H - 110, w: 220, h: 52, label: '返回营地' }, false);
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (screen === 'title') renderTitle();
    else if (screen === 'about') renderAbout();
    else if (screen === 'base') renderBase();
    else if (screen === 'battle') renderBattle();
    else if (screen === 'won') renderResult(true);
    else if (screen === 'lost') renderResult(false);
  }

  /* ========== 13. LOOP ========== */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || 390;
    H = canvas.clientHeight || 844;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    if (battle) computeView();
  }
  window.addEventListener('resize', resize);

  function update(dt) {
    // fx
    for (var i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t >= fx[i].life) fx.splice(i, 1); }
    if (toastT > 0) toastT -= dt;
    if (!battle) return;
    // 单位动画
    var anyAnim = false;
    battle.units.forEach(function (u) {
      if (u.anim) {
        u.anim.t += dt / 0.18;
        if (u.anim.t >= 1) { u.anim = null; }
        else anyAnim = true;
      }
      if (u.flash > 0) u.flash -= dt;
    });
    battle.busy = anyAnim;
    // AI 回合
    if (battle.side === 'B' && !battle.busy && !battle.result) {
      aiTimer -= dt;
      if (aiTimer <= 0) { aiStep(); aiTimer = 0.32; }
    }
  }
  function frame(t) {
    var dt = lastTime ? Math.min((t - lastTime) / 1000, 0.05) : 0.016;
    lastTime = t;
    fpsAcc += dt; fpsCnt++;
    if (fpsAcc >= 0.5) { fps = fpsCnt / fpsAcc; fpsAcc = 0; fpsCnt = 0; }
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ========== 14. BOOT ========== */
  loadSave();
  resize();
  requestAnimationFrame(frame);

  window.__debug = {
    getState: function () { return { screen: screen, battle: battle, save: save }; },
    forceWin: function () { if (battle) finish(true); },
    forceLose: function () { if (battle) finish(false); },
    setLevel: function (i) { startLevel(i); },
    toBase: function () { screen = 'base'; }
  };
})();
</script>
</body></html>
